<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="{{BASE_URL}}">

    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}">

    {{GOOGLE_FONTS}}

    <style>
        :root {
            --brand-color: {{BRAND_COLOR}};
            {{COLOR_VARS}}
            --font-family: '{{FONT_FAMILY}}', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--font-family);
            background: #ffffff; color: #0f172a;
            overflow-x: clip;
        }
        * { box-sizing: border-box; }
        {{TYPE_CSS}}

        /* Menu styles are generated entirely by the Menu Builder (compiler).
           No global rules here, to avoid conflicts. */

        @media (max-width: 768px) {
            .cc-img-text { flex-direction: column !important; }
        }

        /* Scroll animations, hover effects, looping motion, button hovers: canvascore-admin/effects.css */
{{EFFECTS_CSS}}
{{PACKAGE_CSS}}
    </style>
</head>
<body>

    <header>
        {{MAIN_MENU}}
    </header>

    <main>
        {{PAGE_CONTENT}}
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const revealElements = document.querySelectorAll('.cc-reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });
            revealElements.forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
